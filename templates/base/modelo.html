{% extends "base/base.html" %}

{% block title %}{{ module.name }} - FastAPI Odoo{% endblock %}

{% block content %}
    <main class="home-page">
        <header class="home-header">
            <div>
                <p class="eyebrow">{{ module.model }}</p>
                <h1>{{ module.name }}</h1>
                <p>{{ module.description }}</p>
            </div>
            <div class="home-header-actions" data-theme-toggle-container>
                <a class="logout-button" href="/index">Voltar</a>
            </div>
        </header>

        <section class="module-card" aria-live="polite">
            <h2>Registros recentes</h2>
            <p id="modelStatus">Carregando dados do Odoo...</p>
            <ul id="recordList"></ul>
        </section>
    </main>
{% endblock %}

{% block scripts %}
    <script>
        const model = {{ module.model | tojson }};
    </script>
    <script
        src="{{ url_for('static', path='js/base/modelo.js') }}?v={{ static_asset_version('js/base/modelo.js') }}"
    ></script>
{% endblock %}
