<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
            {% block title %}
                FastAPI Odoo
            {% endblock %}
        </title>

        <link rel="stylesheet" href="{{ url_for('static', path='css/base/base.css') }}">

        {% block head %}

        {% endblock %}
    </head>

    <body class="{% block body_class %}{% endblock %}"{% block body_attributes %}{% endblock %}>
        {% block content %}

        {% endblock %}

        <button
            id="themeToggle"
            class="theme-toggle global-theme-toggle"
            type="button"
            aria-label="Ativar modo escuro"
            title="Ativar modo escuro"
        >
            🌙
        </button>

        <div id="loadingOverlay" class="loading-overlay hidden" aria-hidden="true">
            <div class="loading-spinner" role="status" aria-label="Carregando"></div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite">
            <span id="toastIcon">✓</span>
            <span id="toastMessage">Operação realizada.</span>
        </div>

        <script src="{{ url_for('static', path='js/base/base.js') }}"></script>

        {% block scripts %}

        {% endblock %}
    </body>
</html>
