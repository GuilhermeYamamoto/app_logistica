<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
            {% block title %}
                FastAPI Odoo
            {% endblock %}
        </title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', path='css/base/base.css') }}?v={{ static_asset_version('css/base/base.css') }}"
        >

        {% block head %}

        {% endblock %}
    </head>

    <body class="{% block body_class %}{% endblock %}"{% block body_attributes %}{% endblock %}>
        {% block content %}

        {% endblock %}

        <!-- =====================================================
         PULL TO REFRESH
        ====================================================== -->

        <div id="pullToRefresh" class="pull-to-refresh" aria-hidden="true">
            <div class="pull-refresh-icon" id="pullRefreshIcon">
                ↓
            </div>

            <span id="pullRefreshText">
                Puxe para atualizar
            </span>
        </div>

        <!-- =====================================================
         THEME TOGGLE
        ====================================================== -->

        <button
            id="themeToggle"
            class="theme-toggle global-theme-toggle"
            type="button"
            aria-label="Ativar modo escuro"
            title="Ativar modo escuro"
        >
            🌙
        </button>

        <div id="loadingOverlay" class="loading-overlay hidden" aria-hidden="true">
            <div class="loading-spinner" role="status" aria-label="Carregando">
                <div class="loading-box" style="--box-delay: 0s;">
                    <span class="loading-box-flap loading-box-flap-left"></span>
                    <span class="loading-box-flap loading-box-flap-right"></span>
                    <span class="loading-box-body"><span class="loading-box-tape"></span></span>
                </div>
                <div class="loading-box" style="--box-delay: calc(var(--box-cycle) / -3);">
                    <span class="loading-box-flap loading-box-flap-left"></span>
                    <span class="loading-box-flap loading-box-flap-right"></span>
                    <span class="loading-box-body"><span class="loading-box-tape"></span></span>
                </div>
                <div class="loading-box" style="--box-delay: calc(var(--box-cycle) / -1.5);">
                    <span class="loading-box-flap loading-box-flap-left"></span>
                    <span class="loading-box-flap loading-box-flap-right"></span>
                    <span class="loading-box-body"><span class="loading-box-tape"></span></span>
                </div>
            </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite">
            <span id="toastIcon">✓</span>
            <span id="toastMessage">Operação realizada.</span>
        </div>

        <script
            src="{{ url_for('static', path='js/base/base.js') }}?v={{ static_asset_version('js/base/base.js') }}"
        ></script>

        {% block scripts %}

        {% endblock %}
    </body>
</html>
