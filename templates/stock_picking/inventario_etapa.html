{% extends "base/base.html" %}

{% block title %}{{ stage.name }} - Inventário{% endblock %}

{% block content %}
    <main class="home-page">
        <header class="home-header">
            <div>
                <p class="eyebrow">Inventário</p>
                <h1>{{ stage.name }}</h1>
                <p>Registros pendentes nesta etapa.</p>
            </div>
            <div class="home-header-actions" data-theme-toggle-container>
                <a class="logout-button" href="/inventario">Todas as etapas</a>
            </div>
        </header>

        <section class="records-panel" aria-live="polite">
            <p id="stageStatus">Carregando registros do Odoo...</p>
            <ul id="stageRecordList" class="stage-record-list"></ul>
        </section>
    </main>
{% endblock %}

{% block scripts %}
    <script>
        const inventoryStage = {{ stage.key | tojson }};
        const inventoryStageRecords = {{ records.records | tojson }};
    </script>
    <script src="{{ url_for('static', path='js/stock_picking/inventario-etapas.js') }}"></script>
{% endblock %}
